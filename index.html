<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500&family=DM+Sans:wght@400;500&display=swap');
  :root{--bg:#080b0d;--panel:#121719;--panel-soft:#181e20;--line:#2a3234;--text:#f2f5ef;--muted:#89918c;--accent:#b6ff00;--accent-hover:#c5ff36;--accent-ink:#101500}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background-color:var(--bg);background-image:linear-gradient(rgba(182,255,0,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(182,255,0,.035) 1px,transparent 1px),radial-gradient(circle at 50% 20%,#15201b 0,transparent 46%);background-size:64px 64px,64px 64px,100% 100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .card{background:rgba(18,23,25,.96);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:860px;box-shadow:0 24px 80px rgba(0,0,0,.42),0 0 0 1px rgba(182,255,0,.025) inset}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .title{font-size:15px;font-weight:500;color:var(--text);letter-spacing:-0.01em}
  .badge{font-family:'DM Mono',monospace;font-size:10px;padding:4px 8px;border-radius:6px;background:rgba(182,255,0,.12);color:var(--accent);border:1px solid rgba(182,255,0,.22);letter-spacing:0.04em}
  .workspace{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:20px;align-items:stretch}
  .code-field{display:flex;flex-direction:column;min-width:0}
  .field-label{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:8px}
  textarea{width:100%;min-height:320px;flex:1;resize:vertical;padding:14px 16px;font-family:'DM Mono',monospace;font-size:12.5px;line-height:1.7;background:#0c1012;color:var(--text);border:1.5px solid var(--line);border-radius:10px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;caret-color:var(--accent)}
  textarea::placeholder{color:#59615d}
  textarea:focus{border-color:var(--accent);background:#0a0e0f;box-shadow:0 0 0 3px rgba(182,255,0,.1)}
  .sidebar{display:flex;flex-direction:column;padding-top:27px;min-width:0}
  .copy-actions{display:flex;flex-direction:column;gap:8px;width:100%}
  .btn-copy{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--accent-ink);letter-spacing:-0.01em;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;white-space:nowrap}
  .btn-copy:hover{background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:0 0 24px rgba(182,255,0,.16)}
  .btn-copy:active{transform:scale(0.97)}
  .btn-copy:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .btn-copy.copied{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn-copy--wrap{padding-inline:14px;background:var(--panel-soft);color:var(--text);border-color:var(--line)}
  .btn-copy--wrap:hover{background:#222a2c;border-color:#465052;box-shadow:none}
  .status{font-size:12px;color:var(--muted);opacity:0;transition:opacity 0.25s;white-space:nowrap;margin-top:14px;text-align:center}
  .status.visible{opacity:1;color:var(--accent)}
  .hint{font-size:12px;color:var(--muted);line-height:1.6;text-align:center;margin-top:auto;padding-top:20px}
  .hint strong{font-weight:500;color:var(--text)}
  @media (max-width:700px){
    body{padding:20px 12px}
    .card{padding:24px}
    .workspace{grid-template-columns:1fr}
    textarea{min-height:260px}
    .sidebar{padding-top:0}
    .hint{margin-top:0}
  }
</style>

<div class="card">
  <div class="header">
    <span class="title">Webflow Embed Converter</span>
    <span class="badge">HTML → JSON</span>
  </div>
  <div class="workspace">
    <div class="code-field">
      <div class="field-label">Код</div>
      <textarea id="input" placeholder="<div>&#10;  <!-- вставь HTML/JS/CSS сюда -->&#10;</div>" spellcheck="false"></textarea>
    </div>
    <div class="sidebar">
      <div class="copy-actions">
        <button type="button" class="btn-copy" onclick="copyJSON(this)">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M3 9H2C1.44772 9 1 8.55228 1 8V2C1 1.44772 1.44772 1 2 1H8C8.55228 1 9 1.44772 9 2V3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          Скопировать JSON
        </button>
        <button type="button" class="btn-copy btn-copy--wrap" onclick="copyJSON(this, 'script')">Как &lt;script&gt;</button>
        <button type="button" class="btn-copy btn-copy--wrap" onclick="copyJSON(this, 'style')">Как &lt;style&gt;</button>
      </div>
      <span class="status" id="status"></span>
      <span class="hint">Cmd+V в Webflow <strong>Embed</strong></span>
    </div>
  </div>
</div>

<script>
  const input = document.getElementById('input');
  const status = document.getElementById('status');

  function generateId() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  function buildWebflowEmbed(code) {
    const id = generateId();
    return {
      "type": "@webflow/XscpData",
      "payload": {
        "nodes": [{
          "_id": id,
          "type": "HtmlEmbed",
          "tag": "div",
          "classes": [],
          "children": [],
          "v": code,
          "data": {
            "search": {"exclude": true},
            "embed": {
              "type": "html",
              "meta": {"html": code, "div": false, "iframe": false, "script": false, "compilable": false}
            },
            "insideRTE": false,
            "content": "",
            "devlink": {"runtimeProps": {}, "slot": ""},
            "displayName": "",
            "attr": {"id": ""},
            "xattr": [],
            "visibility": {"conditions": [], "keepInHtml": {"tag": "False", "val": {}}}
          }
        }],
        "styles": [],
        "assets": [],
        "ix1": [],
        "ix2": {"interactions": [], "events": [], "actionLists": []}
      },
      "meta": {
        "droppedLinks": 0,
        "dynBindRemovedCount": 0,
        "dynListBindRemovedCount": 0,
        "paginationRemovedCount": 0,
        "universalBindingsRemovedCount": 0,
        "unlinkedSymbolCount": 0,
        "codeComponentsRemovedCount": 0
      }
    };
  }

  let activeButton = null;

  function showStatus(text, isSuccess) {
    const button = activeButton;
    status.textContent = text;
    status.classList.add('visible');
    if (isSuccess && button) button.classList.add('copied');
    setTimeout(() => {
      status.classList.remove('visible');
      if (button) button.classList.remove('copied');
      if (activeButton === button) activeButton = null;
    }, 2500);
  }

  let pendingJSON = null;
  const hiddenTrigger = document.createElement('button');
  hiddenTrigger.contentEditable = 'true';
  Object.assign(hiddenTrigger.style, {
    position: 'fixed', clip: 'rect(1px,1px,1px,1px)',
    clipPath: 'inset(0 0 99.9% 99.9%)', overflow: 'hidden',
    height: '1px', width: '1px', padding: '0', border: '0'
  });
  document.body.appendChild(hiddenTrigger);

  hiddenTrigger.addEventListener('copy', (e) => {
    if (!pendingJSON) return;
    e.clipboardData.setData('application/json', pendingJSON);
    e.preventDefault();
    pendingJSON = null;
    showStatus('✓ Скопировано', true);
  });

  function copyJSON(button, wrapper) {
    let code = input.value;
    if (!code.trim()) {
      activeButton = null;
      showStatus('⚠ Нет кода', false);
      return;
    }
    if (wrapper) code = `<${wrapper}>\n${code}\n</${wrapper}>`;
    activeButton = button;
    const jsonObject = buildWebflowEmbed(code);
    pendingJSON = JSON.stringify(jsonObject);
    hiddenTrigger.focus();
    document.execCommand('copy');
  }
</script>
